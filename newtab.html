<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ebium — Yeni Sekme</title>
  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="newtab.css">
</head>
<body>

  <!-- Ambient Background Glows -->
  <div class="ambient-glow glow-top"></div>
  <div class="ambient-glow glow-bottom"></div>

  <div class="dashboard-wrapper">
    
    <!-- ── Top Bar ── -->
    <header class="top-nav">
      <div class="brand-chip">
        <img src="Ebium.ico" alt="Ebium" class="brand-chip-logo">
        <span class="brand-chip-name">Ebium</span>
        <span class="brand-chip-badge">v1.0</span>
      </div>

      <div class="top-right-group">
        <div class="status-chip" id="greeting-chip">
          <span class="chip-icon-box" id="greeting-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </span>
          <span id="greeting" class="greeting-bold">Hoş Geldin</span>
        </div>

        <div class="status-chip" id="date-chip">
          <span class="chip-icon-box">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/></svg>
          </span>
          <span id="date-text" class="date-bold"></span>
        </div>

        <a href="ebium://ayarlar" class="action-chip" title="Ayarlar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </a>
      </div>
    </header>

    <!-- ── Center Hero Section ── -->
    <main class="hero-section">
      
      <!-- Brand & 3D Interactive Emblem -->
      <div class="brand-hero">
        <div class="brand-3d-box" id="brand-3d">
          <img src="Ebium.ico" class="brand-hero-logo" alt="Ebium">
          <div class="brand-aura"></div>
        </div>
      </div>

      <!-- Modern Bold Clock -->
      <div class="clock-display" id="time-text">12:00</div>

      <!-- Pill Search Box -->
      <div class="search-wrapper">
        <form class="search-form" id="search-form" action="https://www.google.com/search" method="GET">
          <div class="search-engine-badge" id="search-engine-toggle" title="Arama motoru">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span class="engine-name" id="current-engine-label">Google</span>
          </div>
          <input type="text" name="q" id="search-input" class="search-input" placeholder="Web'de ara veya URL gir..." autocomplete="off" autofocus>
          <button type="submit" class="search-submit-btn" title="Ara">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </form>

        <!-- Quick Engine Selector Chips -->
        <div class="search-engine-chips">
          <button type="button" class="engine-chip active" data-engine="google">Google</button>
          <button type="button" class="engine-chip" data-engine="duckduckgo">DuckDuckGo</button>
          <button type="button" class="engine-chip" data-engine="bing">Bing</button>
          <button type="button" class="engine-chip" data-engine="youtube">YouTube</button>
        </div>
      </div>

      <!-- ── Shortcuts Section ── -->
      <section class="shortcuts-section">
        <div class="section-header">
          <h2 class="section-title">Hızlı Erişim</h2>
        </div>
        <div class="shortcuts-grid" id="shortcuts-container">
          <!-- Populated by newtab.js -->
        </div>
      </section>

      <!-- ── Productivity & Inspiration Widgets Row ── -->
      <section class="widgets-row">
        <!-- Daily Inspiration Card -->
        <div class="widget-card quote-card" id="quote-box">
          <div class="widget-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 21c3 0 7-1 7-8V5c0-1.25-.75-2-2-2H4c-1.25 0-2 .75-2 2v6c0 7 1 8 3 10z"></path>
              <path d="M15 21c3 0 7-1 7-8V5c0-1.25-.75-2-2-2h-4c-1.25 0-2 .75-2 2v6c0 7 1 8 3 10z"></path>
            </svg>
            <span>Günün İlhamı</span>
          </div>
          <p id="quote-text" class="quote-content"></p>
          <span id="quote-author" class="quote-by"></span>
        </div>

        <!-- Quick Notes Widget -->
        <div class="widget-card notes-card">
          <div class="widget-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"></path>
            </svg>
            <span>Hızlı Not</span>
          </div>
          <textarea id="quick-note-input" class="quick-note-textarea" placeholder="Buraya aklındakileri yaz... Otomatik kaydedilir."></textarea>
        </div>
      </section>

    </main>

    <!-- ── Footer ── -->
    <footer class="bottom-footer">
      <span>Ebium Browser — Hızlı, Güvenli ve Özgür</span>
    </footer>

  </div>

  <!-- ── Add Shortcut Modal ── -->
  <div id="add-shortcut-modal" class="modal-overlay hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">Yeni Kısayol Ekle</h3>
        <button id="btn-close-modal" class="modal-close-btn" title="Kapat">✕</button>
      </div>
      <div class="modal-body">
        <div class="input-group">
          <label for="shortcut-title">Başlık</label>
          <input type="text" id="shortcut-title" placeholder="Örn: Wikipedia, GitHub" autocomplete="off">
        </div>
        <div class="input-group">
          <label for="shortcut-url">Web Adresi (URL)</label>
          <input type="text" id="shortcut-url" placeholder="Örn: wikipedia.org" autocomplete="off">
        </div>
      </div>
      <div class="modal-actions">
        <button id="btn-cancel-shortcut" class="btn-secondary">İptal</button>
        <button id="btn-save-shortcut" class="btn-primary">Kısayolu Ekle</button>
      </div>
    </div>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
